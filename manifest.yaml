schema: orca.image-manifest/v1
slug: elo-digital-office
application:
  display_name: ELO Digital Office
  category: Document Management
  description: >-
    Ubuntu virtual machine that stages ELO 25 Server Setup and local PostgreSQL
    so each tenant can finish the vendor wizard with their own license. This
    source stops before license apply, archive apply, and Web Client install.
    It is not a snapshot of a lab VM.
  version: "25.0"
base_os:
  distribution: ubuntu
  release: "24.04"
architecture: x86_64
instance_type: virtual-machine
minimum_resources:
  cpu: 4
  memory_mib: 8192
  storage_gib: 80
network:
  default_policy: private
exposer:
  enabled: true
  endpoints:
    - name: setup
      protocol: http
      target_port: 7458
      default_public: false
      tls: automatic
persistent_paths:
  - path: /opt/elo
  - path: /var/lib/postgresql
  - path: /var/lib/elo-setup
upstream:
  source_url: https://docs.elo.com/en-us/elo-help/
  homepage: https://docs.elo.com/en-us/elo-help/
  version_url: https://docs.elo.com/25-lts/en-us/
  version_strategy: vendor-docs
branding:
  local_path: assets/logo.png
  logo_source_url: https://www.elo.com/typo3conf/ext/nelo_elocom_templates/Resources/Public/Images/logo_elo.svg
build:
  ready: false
  recipe: recipes/build.sh
  acceptance_test: recipes/acceptance.sh
publication:
  state: qualification-pending
